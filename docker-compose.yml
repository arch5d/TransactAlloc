services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TRANSALLOC_DB_NAME:-transactalloc_p3}
      POSTGRES_USER: ${TRANSALLOC_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TRANSALLOC_DB_PASSWORD:?Set TRANSALLOC_DB_PASSWORD before starting Compose}
    ports:
      - "${TRANSALLOC_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
