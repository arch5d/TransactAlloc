name: Database-free tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile application and test modules
        run: >
          python -m py_compile
          adaptive.py api.py app.py banker.py db.py engine.py evaluate.py
          frag.py main.py policies.py scheduler.py wfg.py worker.py
          tests/test_cli.py tests/test_engine.py tests/test_evaluate.py
          tests/test_pure.py

      - name: Run database-free tests
        run: >
          python -m pytest
          tests/test_evaluate.py
          tests/test_pure.py
          tests/test_cli.py
          tests/test_engine.py
          -q
